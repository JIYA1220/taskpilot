services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Secrets come from .env at runtime; .env is never copied into the image.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/taskpilot.db
      MAILPIT_HOST: mailpit
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - mailpit

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web inbox
      - "1025:1025" # SMTP
