[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskpilot"
version = "0.1.0"
description = "AI work tracker for small teams"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "httpx>=0.27",
    "openai>=1.50",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "tzdata>=2024.1",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
# aiosmtpd is a local SMTP server: tests use it to exercise the real SMTP code path, and
# scripts/dev_mailbox.py uses it as a stand-in for Mailpit when Docker is not available.
dev = ["pytest>=8", "aiosmtpd>=1.4"]

[tool.setuptools.packages.find]
include = ["backend*", "scripts*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
